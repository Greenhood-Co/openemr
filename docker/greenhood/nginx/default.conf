# Greenhood: HTTP entry — only this port is published to the host in docker-compose.yml.
server {
    listen 80;
    server_name _;

    # Liveness: nginx itself is up. Says nothing about the active OpenEMR slot.
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness: proxies to the active slot so the container healthcheck fails when that
    # slot is down, instead of reporting healthy while every real request returns 502.
    location = /upstream-health {
        allow 127.0.0.1;
        deny all;
        rewrite ^ /meta/health/readyz break;
        include /etc/nginx/greenhood/active-backend.conf;
    }

    location / {
        include /etc/nginx/greenhood/active-backend.conf;
    }
}
